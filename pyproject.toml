[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-fleet-compare"
version = "0.1.0"
description = "a2a-fleet-compare"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ZidoCode" }]
keywords = ["agents", "audit", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
a2a-fleet-compare = "a2a_fleet_compare:main"

[tool.setuptools]
py-modules = ["a2a_fleet_compare"]
